[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-peanut-gallery-bridge"
version = "1.0.0"
description = "Independent, self-hosted reaction delivery bridge"
readme = "bridge/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Will" }]
dependencies = []

[project.scripts]
sol-peanut-gallery = "peanut_gallery_bridge.cli:main"
sol-peanut-gallery-battery-watch = "peanut_gallery_bridge.battery_watch:main"

[tool.setuptools]
package-dir = { "" = "bridge/src" }

[tool.setuptools.packages.find]
where = ["bridge/src"]
