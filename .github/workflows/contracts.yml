name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bridge-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: >-
          ./gradlew --no-daemon
          testDebugUnitTest lintDebug assembleDebug
          testReleaseUnitTest lintRelease assembleRelease
